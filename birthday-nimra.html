<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Nimra</title>
<style>
body{margin:0;background:linear-gradient(pink,#ffe6f0);font-family:Arial;text-align:center}
.box{background:#fff;width:90%;max-width:400px;margin:120px auto;padding:30px;border-radius:20px;box-shadow:0 5px 20px #0003}
input{padding:12px;width:80%;border:2px solid pink;border-radius:10px;font-size:16px}
button{padding:12px 30px;background:hotpink;color:#fff;border:0;border-radius:20px;font-size:16px;margin-top:10px;cursor:pointer}
#main{display:none;padding:30px}
h1{color:hotpink}
</style>
</head>
<body>

<div class="box" id="login">
<h2>🔒 Secret</h2>
<p>Password dalo</p>
<input type="password" id="pass" placeholder="nimra">
<br>
<button onclick="check()">Open</button>
<p id="err" style="color:red;display:none">Ghalat password</p>
</div>

<div id="main">
<h1>Happy Birthday Nimra ul Nisa ❤️</h1>
<p style="font-size:18px">Pyari shehzadi,<br>Ap meri jan ho nimo sachi...<br> ma ap sa bohat pyar krta hon sachi meri jan meri shehzadi muja kbhi chor k mat jana shadi b muj sa he krna...<br>Love you 🫂</p>
</div>

<script>
function check(){
  var p = document.getElementById("pass").value;
  if(p.toLowerCase() == "nimra"){
    document.getElementById("login").style.display = "none";
    document.getElementById("main").style.display = "block";
  } else {
    document.getElementById("err").style.display = "block";
  }
}
// Enter se bhi khule
document.getElementById("pass").onkeypress = function(e){
  if(e.keyCode == 13) check();
}
</script>

</body>
</html>
